<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#286ef0" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Card Glassmorphism Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Decorative Tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0,200 L 1200,200" />
    <path d="M 0,400 L 1200,400" />
    <path d="M 0,600 L 1200,600" />
    <path d="M 300,0 L 300,800" />
    <path d="M 600,0 L 600,800" />
    <path d="M 900,0 L 900,800" />
  </g>

  <!-- Glowing Background Orbs -->
  <circle cx="250" cy="250" r="180" fill="#286ef0" opacity="0.15" filter="url(#glow)" />
  <circle cx="950" cy="550" r="220" fill="#3b82f6" opacity="0.1" filter="url(#glow)" />

  <!-- Central Card Container -->
  <g transform="translate(150, 120)">
    <!-- Outer Card Border & Fill -->
    <rect width="900" height="560" rx="32" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5" backdrop-filter="blur(20px)" />
    
    <!-- Code Bracket Icon / Graphic Element -->
    <g transform="translate(450, 160)">
      <circle cx="0" cy="0" r="65" fill="#286ef0" fill-opacity="0.15" stroke="#286ef0" stroke-opacity="0.3" stroke-width="2" />
      <text x="0" y="20" font-family="monospace" font-size="54" font-weight="bold" fill="url(#accentGrad)" text-anchor="middle">&lt;/&gt;</text>
    </g>

    <!-- Company Branding / Name -->
    <text x="450" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">Drevyyqo Technologies</text>
    
    <!-- Tagline -->
    <text x="450" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Building Scalable Full-Stack Digital Solutions</text>

    <!-- Feature Badges -->
    <g transform="translate(225, 420)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="40" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="65" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#60a5fa" text-anchor="middle">Next.js</text>

      <!-- Badge 2 -->
      <rect x="150" y="0" width="140" height="40" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="220" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">MongoDB</text>

      <!-- Badge 3 -->
      <rect x="310" y="0" width="140" height="40" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="380" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle">Tailwind CSS</text>
    </g>

    <!-- Decorative Bottom Line Accent -->
    <rect x="350" y="500" width="200" height="4" rx="2" fill="url(#accentGrad)" />
  </g>
</svg>
