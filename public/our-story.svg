<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="storyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="storyAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#286ef0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="storyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#storyBg)" />

  <!-- Subtle Background Grid -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <path d="M 0,150 L 1200,150" />
    <path d="M 0,300 L 1200,300" />
    <path d="M 0,450 L 1200,450" />
    <path d="M 0,600 L 1200,600" />
    <path d="M 200,0 L 200,800" />
    <path d="M 500,0 L 500,800" />
    <path d="M 800,0 L 800,800" />
    <path d="M 1000,0 L 1000,800" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="300" cy="300" r="200" fill="#286ef0" opacity="0.12" filter="url(#storyGlow)" />
  <circle cx="900" cy="500" r="250" fill="#0ea5e9" opacity="0.08" filter="url(#storyGlow)" />

  <!-- Main Container Card -->
  <g transform="translate(100, 100)">
    <rect width="1000" height="600" rx="36" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" />

    <!-- Top Badge / Subtitle -->
    <g transform="translate(500, 90)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#286ef0" fill-opacity="0.15" stroke="#286ef0" stroke-opacity="0.3" stroke-width="1" />
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="1">OUR STORY</text>
    </g>

    <!-- Main Heading -->
    <text x="500" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">Innovating Digital Futures</text>
    
    <!-- Description Paragraph / Mission Statement -->
    <text x="500" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">Founded with a passion for robust engineering and sleek design, Drevyyqo Technologies</text>
    <text x="500" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">transforms complex ideas into scalable, high-performance web applications.</text>

    <!-- Milestone / Timeline Cards -->
    <g transform="translate(100, 310)">
      <!-- Card 1: Vision -->
      <rect x="0" y="0" width="245" height="180" rx="20" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="45" cy="45" r="20" fill="#286ef0" fill-opacity="0.2" />
      <text x="45" y="52" font-family="system-ui" font-size="16" fill="#60a5fa" text-anchor="middle">💡</text>
      <text x="45" y="95" font-family="system-ui" font-size="16" font-weight="700" fill="#ffffff">The Vision</text>
      <text x="45" y="120" font-family="system-ui" font-size="13" fill="#94a3b8">Building digital tools</text>
      <text x="45" y="140" font-family="system-ui" font-size="13" fill="#94a3b8">that empower brands.</text>

      <!-- Card 2: Growth -->
      <rect x="275" y="0" width="245" height="180" rx="20" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="320" cy="45" r="20" fill="#10b981" fill-opacity="0.2" />
      <text x="320" y="52" font-family="system-ui" font-size="16" fill="#34d399" text-anchor="middle">🚀</text>
      <text x="320" y="95" font-family="system-ui" font-size="16" font-weight="700" fill="#ffffff">Fast Execution</text>
      <text x="320" y="120" font-family="system-ui" font-size="13" fill="#94a3b8">Next.js &amp; modern stacks</text>
      <text x="320" y="140" font-family="system-ui" font-size="13" fill="#94a3b8">for lightning speed.</text>

      <!-- Card 3: Impact -->
      <rect x="550" y="0" width="245" height="180" rx="20" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="595" cy="45" r="20" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="595" y="52" font-family="system-ui" font-size="16" fill="#a78bfa" text-anchor="middle">⭐</text>
      <text x="595" y="95" font-family="system-ui" font-size="16" font-weight="700" fill="#ffffff">Client Success</text>
      <text x="595" y="120" font-family="system-ui" font-size="13" fill="#94a3b8">Delivering excellence</text>
      <text x="595" y="140" font-family="system-ui" font-size="13" fill="#94a3b8">in every project.</text>
    </g>

    <!-- Bottom Accent Line -->
    <rect x="400" y="540" width="200" height="4" rx="2" fill="url(#storyAccent)" />
  </g>
</svg>
